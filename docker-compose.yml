services:
  postgres:
    image: postgres:16-alpine
    container_name: onion-auth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/adapters/postgres/migrations/001_create_users.sql:/docker-entrypoint-initdb.d/001_create_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
